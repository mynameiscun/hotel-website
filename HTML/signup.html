<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../JS/jquery-4.0.0.min.js"></script>
    <link rel="stylesheet" href="../CSS/signup.css" />
    <title>Đăng ký tài khoản</title>
</head>

<body>
    <!-- SIGN UP PAGE -->
    <section class="auth-container">
        <div class="auth-card">

            <!-- LOGO -->
            <div class="hotel-logo">
                <div class="logo-icon">
                    <img src="../IMAGE/logo.png" alt="Plazzo Serento Logo">
                </div>
                <p>PLAZZO SERENTO</p>
                <div class="stars">★★★★★</div>
            </div>

            <h2>Đăng ký</h2>

            <div class="decor-line">
                <span></span>
                <i>◇</i>
                <span></span>
            </div>

            <form id="signup-form">

                <div class="input-group">
                    <label for="signup-name">Họ tên</label>
                    <div class="input-wrap">
                        <input
                            type="text"
                            id="signup-name"
                            placeholder="Nhập họ tên"
                            required
                        />
                    </div>
                </div>

                <div class="input-group">
                    <label for="signup-email">Email</label>
                    <div class="input-wrap">
                        <input
                            type="email"
                            id="signup-email"
                            placeholder="Nhập email"
                            required
                        />
                    </div>
                </div>

                <div class="input-group">
                    <label for="signup-username">Tên đăng nhập</label>
                    <div class="input-wrap">
                        <input
                            type="text"
                            id="signup-username"
                            placeholder="Nhập tên đăng nhập"
                            required
                        />
                    </div>
                </div>

                <div class="input-group">
                    <label for="signup-password">Mật khẩu</label>
                    <div class="input-wrap">
                        <input
                            type="password"
                            id="signup-password"
                            placeholder="Nhập mật khẩu"
                            required
                        />
                    </div>
                </div>

                <button type="submit" class="btn-auth">Đăng ký</button>

                <div class="decor-line bottom-line">
                    <span></span>
                    <i>◇</i>
                    <span></span>
                </div>

                <p class="switch-auth">
                    Bạn đã có tài khoản?
                    <a href="login.html">Đăng nhập ngay</a>
                </p>

            </form>
        </div>
    </section>

    <!-- SUCCESS MODAL -->
    <div id="signupModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>

            <h3>Đăng ký thành công</h3>
            <p>Tài khoản đã được tạo</p>

            <button id="goLogin">Đăng nhập ngay</button>
        </div>
    </div>

    <script src="../JS/signup.js"></script>
</body>
</html>
